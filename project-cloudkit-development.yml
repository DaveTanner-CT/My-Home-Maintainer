name: HomeKeeper

options:
  bundleIdPrefix: org.scriptingforschools

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'

targets:
  HomeKeeper:
    type: application
    platform: iOS

    sources:
      - path: Models
      - path: Services
        excludes:
          - CloudSyncService.swift
          - CloudHouseholdService.swift
          - SupabaseConfiguration.swift
      - path: Utilities
      - path: Views
        excludes:
          - Settings/CloudSyncView.swift
      - path: App
      - path: Resources/Assets.xcassets
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scriptingforschools.HomeMaintainer
        PRODUCT_NAME: "My Home Keeper"
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.48.1'
        CURRENT_PROJECT_VERSION: '481'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: '1,2'

    entitlements:
      path: HomeKeeper-Development.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.scriptingforschools.HomeMaintainer
        com.apple.developer.icloud-container-development-container-identifiers:
          - iCloud.org.scriptingforschools.HomeMaintainer
        com.apple.developer.icloud-container-environment: Development
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)org.scriptingforschools.HomeMaintainer"

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "My Home Keeper"
        CFBundleName: "My Home Keeper"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

        NSCameraUsageDescription: "My Home Keeper lets you take photos of rooms, equipment, labels, receipts, vendors, and projects."
        NSContactsUsageDescription: "My Home Keeper lets you import vendor details from Contacts and add or update vendors in Contacts."
        NSPhotoLibraryUsageDescription: "My Home Keeper lets you attach photos to home records and project ideas."

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        UILaunchScreen: {}

        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
