name: HomeKeeper

options:
  bundleIdPrefix: org.scriptingforschools

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'

targets:
  HomeKeeper:
    type: application
    platform: iOS

    sources:
      - path: Models
      - path: Services
      - path: Utilities
      - path: Views
      - path: App
      - path: Resources/Assets.xcassets
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scriptingforschools.HomeMaintainer
        PRODUCT_NAME: "My Home Keeper"
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.43'
        CURRENT_PROJECT_VERSION: '430'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: '1,2'

    entitlements:
      path: HomeKeeper.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "My Home Keeper"
        CFBundleName: "My Home Keeper"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

        NSCameraUsageDescription: "My Home Keeper lets you take photos of rooms, equipment, labels, receipts, vendors, and projects."
        NSContactsUsageDescription: "My Home Keeper lets you import vendor details from Contacts and add or update vendors in Contacts."
        NSPhotoLibraryUsageDescription: "My Home Keeper lets you attach photos to home records and project ideas."
        SupabaseProjectURL: "YOUR_SUPABASE_PROJECT_URL"
        SupabasePublishableKey: "YOUR_SUPABASE_PUBLISHABLE_KEY"

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        UILaunchScreen: {}

        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
