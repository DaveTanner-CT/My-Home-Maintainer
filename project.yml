name: HomeKeeper

options:
  bundleIdPrefix: org.scriptingforschools

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'

targets:
  HomeKeeper:
    type: application
    platform: iOS

    sources:
      - path: Models
      - path: Services
      - path: Utilities
      - path: Views
      - path: App

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scriptingforschools.HomeMaintainer
        PRODUCT_NAME: HomeKeeper
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_CFBundleDisplayName: Home Maintainer
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Home Maintainer lets you attach photos to home records and project ideas.
        INFOPLIST_KEY_NSCameraUsageDescription: My Home Keeper lets you photograph equipment labels, paint cans, receipts, and project ideas.
        INFOPLIST_KEY_NSContactsUsageDescription: Home Maintainer lets you import vendor details from Contacts and add vendors to Contacts.

    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
