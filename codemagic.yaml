workflows:
  home-maintainer-adhoc:
    name: My Home Keeper Ad Hoc iPhone + iPad Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: org.scriptingforschools.HomeMaintainer
      vars:
        XCODE_PROJECT: "HomeKeeper.xcodeproj"
        XCODE_SCHEME: "HomeKeeper"

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Verify app entry point
        script: |
          cd "$CM_BUILD_DIR"
          test -f App/HomeKeeperApp.swift
          grep -q "@main" App/HomeKeeperApp.swift

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
          grep -q "HomeKeeperApp.swift" HomeKeeper.xcodeproj/project.pbxproj

      - name: Set up code signing
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  my-home-keeper-home-manager-testflight:
    name: My-Home-Keeper-Home-Manager TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: app_store_connect

    environment:
      xcode: latest

      ios_signing:
        provisioning_profiles:
          - profile: my_home_keeper_app_store_cloudkit_v2
            environment_variable: MY_HOME_KEEPER_PROFILE
        certificates:
          - My Home Maintainer Distribution

      vars:
        XCODE_PROJECT: "HomeKeeper.xcodeproj"
        XCODE_SCHEME: "HomeKeeper"

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Verify app entry point
        script: |
          cd "$CM_BUILD_DIR"
          test -f App/HomeKeeperApp.swift
          grep -q "@main" App/HomeKeeperApp.swift

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
          grep -q "HomeKeeperApp.swift" HomeKeeper.xcodeproj/project.pbxproj

      - name: Verify App Store icon source configuration
        script: |
          cd "$CM_BUILD_DIR"
          grep -q "ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon" project.yml
          grep -q "CFBundleIconName: AppIcon" project.yml
          test -f Resources/Assets.xcassets/AppIcon.appiconset/icon-60x60@2x.png

      - name: Inspect selected provisioning profile
        script: |
          echo "Provisioning profile path:"
          echo "$MY_HOME_KEEPER_PROFILE"

          security cms -D -i "$MY_HOME_KEEPER_PROFILE" > /tmp/profile.plist

          echo "Provisioning profile name:"
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist

          echo "Provisioning profile UUID:"
          /usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist

          echo "Provisioning profile application identifier:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist

          echo "Provisioning profile iCloud containers:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.icloud-container-identifiers" /tmp/profile.plist || true

          echo "Provisioning profile Sign in with Apple:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin" /tmp/profile.plist || true

      - name: Set up code signing
        script: |
          cd "$CM_BUILD_DIR"

          echo "Using provisioning profile:"
          echo "$MY_HOME_KEEPER_PROFILE"

          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --profile "$MY_HOME_KEEPER_PROFILE"

      - name: Verify applied build settings
        script: |
          cd "$CM_BUILD_DIR"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings \
            | grep -E "PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|PRODUCT_BUNDLE_IDENTIFIER"

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR"

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: false
