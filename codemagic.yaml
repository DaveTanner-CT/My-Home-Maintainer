workflows:
  homekeeper-ios-simulator:
    name: HomeKeeper iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "HomeKeeper.xcodeproj"
        XCODE_SCHEME: "HomeKeeper"

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml

      - name: Verify Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Build HomeKeeper for iOS Simulator
        script: |
          cd "$CM_BUILD_DIR"
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
