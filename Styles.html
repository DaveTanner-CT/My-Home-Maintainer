<style>

:root {
  --pds-navy: #2f4356;
  --pds-navy-dark: #243748;
  --pds-terracotta: #c86a4d;
  --pds-terracotta-dark: #ad563e;
  --pds-cream: #f3eee6;
  --pds-cream-light: #faf8f4;
  --pds-white: #ffffff;
  --pds-text: #293b4c;
  --pds-muted: #737b80;
  --pds-border: #dfd9d1;
  --pds-success: #5e7b68;
  --pds-danger: #a94f44;

  --radius-sm: 10px;
  --radius-md: 18px;
  --radius-lg: 26px;

  --shadow:
    0 8px 30px rgba(34, 50, 63, 0.08);

  --shadow-large:
    0 24px 60px rgba(34, 50, 63, 0.18);
}


* {
  box-sizing: border-box;
}


html,
body {
  margin: 0;
  min-height: 100%;
}


body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: var(--pds-cream-light);
  color: var(--pds-text);
}


button,
input,
select,
textarea {
  font: inherit;
}


button {
  -webkit-tap-highlight-color: transparent;
}


.hidden {
  display: none !important;
}


.app-header {
  height: 86px;

  position: sticky;
  top: 0;
  z-index: 50;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 30px;

  background: var(--pds-navy);
  color: white;
}


.brand {
  display: flex;
  align-items: center;
  gap: 12px;

  cursor: pointer;
}


.brand-mark {
  color: var(--pds-terracotta);
  font-size: 27px;
}


.brand-name {
  font-size: 23px;
  font-weight: 700;
  letter-spacing: -0.7px;
}


.brand-name span {
  color: var(--pds-terracotta);
}


.header-action {
  min-height: 46px;

  border: 1px solid rgba(255,255,255,.25);
  border-radius: 12px;

  padding: 0 17px;

  background: rgba(255,255,255,.08);
  color: white;

  font-weight: 700;

  cursor: pointer;
}


.mobile-menu-button {
  display: none;

  border: 0;
  background: transparent;
  color: white;

  font-size: 24px;
}


.app-layout {
  display: grid;
  grid-template-columns: 220px minmax(0,1fr);

  min-height: calc(100vh - 86px);
}


.sidebar {
  position: sticky;
  top: 86px;

  height: calc(100vh - 86px);

  display: flex;
  flex-direction: column;

  background: var(--pds-navy);

  padding: 18px 18px 25px;
}


.nav {
  display: flex;
  flex-direction: column;
  gap: 7px;
}


.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;

  border: 0;

  padding: 14px 16px;

  border-radius: 12px;

  text-align: left;

  background: transparent;
  color: rgba(255,255,255,.72);

  font-weight: 600;

  cursor: pointer;
}


.nav-item span {
  width: 20px;
  text-align: center;
}


.nav-item:hover,
.nav-item.active {
  background: rgba(255,255,255,.1);
  color: white;
}


.sidebar-footer {
  margin-top: auto;

  padding: 15px;

  color: rgba(255,255,255,.4);

  font-size: 11px;
}


.main-content {
  width: 100%;
  max-width: 1500px;

  padding: 46px;
}


.page-heading {
  margin-bottom: 34px;
}


.page-heading-with-action {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 30px;

  margin-bottom: 28px;
}


.eyebrow {
  margin: 0 0 8px;

  color: var(--pds-terracotta);

  font-size: 12px;
  font-weight: 800;

  letter-spacing: 1.6px;
}


h1 {
  margin: 0;

  font-size: clamp(34px,4vw,55px);
  line-height: 1.02;

  letter-spacing: -2px;

  color: var(--pds-navy);
}


h2 {
  margin: 0;

  color: var(--pds-navy);

  font-size: 30px;
  letter-spacing: -1px;
}


h3 {
  color: var(--pds-navy);
}


.page-subtitle {
  margin: 14px 0 0;

  max-width: 700px;

  color: var(--pds-muted);

  font-size: 18px;
  line-height: 1.6;
}


.summary-grid {
  display: grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap: 18px;

  margin-bottom: 48px;
}


.summary-card {
  min-height: 165px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  padding: 25px;

  border-radius: var(--radius-md);

  background: white;
  box-shadow: var(--shadow);
}


.summary-card.clickable {
  cursor: pointer;
}


.summary-card.accent {
  background: var(--pds-terracotta);
  color: white;
}


.summary-label {
  font-size: 14px;
  font-weight: 700;
}


.summary-card:not(.accent)
.summary-label {
  color: var(--pds-muted);
}


.summary-value {
  font-size: 47px;
  line-height: 1;

  font-weight: 700;
}


.summary-link {
  color: var(--pds-terracotta);

  font-size: 13px;
  font-weight: 700;
}


.summary-link.light {
  color: rgba(255,255,255,.75);
}


.content-section {
  background: white;

  border-radius: var(--radius-lg);

  padding: 30px;

  box-shadow: var(--shadow);
}


.section-heading {
  display: flex;

  align-items: flex-end;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 25px;
}


.primary-button,
.secondary-button {
  min-height: 48px;

  border-radius: 12px;

  padding: 0 20px;

  font-weight: 700;

  cursor: pointer;
}


.primary-button {
  border: 0;

  background: var(--pds-terracotta);
  color: white;
}


.primary-button:hover {
  background: var(--pds-terracotta-dark);
}


.primary-button:disabled {
  opacity: .55;
  cursor: wait;
}


.secondary-button {
  border: 1px solid var(--pds-border);

  background: white;
  color: var(--pds-navy);
}


.toolbar {
  margin-bottom: 24px;
}


.toolbar-split {
  display: flex;
  gap: 14px;
}


.search-box {
  min-height: 50px;

  flex: 1;

  display: flex;
  align-items: center;
  gap: 10px;

  padding: 0 15px;

  border: 1px solid var(--pds-border);
  border-radius: 13px;

  background: white;
}


.search-box input {
  width: 100%;

  border: 0;
  outline: 0;

  background: transparent;

  color: var(--pds-text);
}


.filter-select {
  min-height: 50px;

  min-width: 220px;

  padding: 0 14px;

  border: 1px solid var(--pds-border);
  border-radius: 13px;

  background: white;
  color: var(--pds-text);
}


.project-grid {
  display: grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap: 18px;
}


.project-card {
  min-height: 230px;

  display: flex;
  flex-direction: column;

  padding: 22px;

  border: 1px solid var(--pds-border);
  border-radius: var(--radius-md);

  background: white;

  cursor: pointer;

  transition:
    transform 150ms ease,
    box-shadow 150ms ease;
}


.project-card:hover {
  transform: translateY(-2px);

  box-shadow:
    0 10px 24px rgba(34,50,63,.08);
}


.project-card-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}


.project-status {
  display: inline-flex;

  margin-bottom: 24px;

  padding: 7px 10px;

  border-radius: 999px;

  background:
    rgba(200,106,77,.13);

  color:
    var(--pds-terracotta-dark);

  font-size: 11px;
  font-weight: 800;

  letter-spacing: .6px;
  text-transform: uppercase;
}


.project-card h3 {
  margin: 0 0 5px;

  font-size: 21px;
}


.project-client {
  margin-bottom: 5px;

  color: var(--pds-muted);

  font-size: 14px;
}


.project-id {
  color: var(--pds-muted);

  font-size: 12px;
}


.project-card-footer {
  margin-top: auto;
  padding-top: 20px;

  display: flex;
  justify-content: space-between;
  gap: 12px;

  color: var(--pds-muted);

  font-size: 13px;
}


.client-grid {
  display: grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap: 18px;
}


.client-card {
  padding: 24px;

  border: 1px solid var(--pds-border);
  border-radius: var(--radius-md);

  background: white;

  box-shadow:
    0 4px 18px rgba(34,50,63,.04);
}


.client-initials {
  width: 48px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 20px;

  border-radius: 50%;

  background: var(--pds-cream);
  color: var(--pds-terracotta);

  font-weight: 800;
}


.client-card h3 {
  margin: 0 0 5px;
}


.client-contact {
  margin-top: 15px;

  display: grid;
  gap: 6px;

  color: var(--pds-muted);

  font-size: 13px;
}


.client-project-counts {
  display: flex;
  gap: 18px;

  margin-top: 22px;
  padding-top: 18px;

  border-top: 1px solid var(--pds-border);

  font-size: 13px;
}


.client-project-counts strong {
  display: block;

  color: var(--pds-navy);

  font-size: 20px;
}


.back-button {
  margin-bottom: 25px;

  border: 0;
  background: transparent;

  padding: 0;

  color: var(--pds-terracotta);

  font-weight: 700;

  cursor: pointer;
}


.project-detail-header {
  margin-bottom: 25px;
}


.project-detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;

  margin-top: 17px;

  color: var(--pds-muted);

  font-size: 14px;
}


.project-detail-layout {
  display: grid;

  grid-template-columns:
    minmax(0,2fr) minmax(280px,1fr);

  gap: 22px;
}


.detail-panel {
  padding: 28px;

  border-radius: var(--radius-md);

  background: white;

  box-shadow: var(--shadow);
}


.project-tabs {
  display: flex;
  gap: 6px;

  overflow-x: auto;

  margin-bottom: 22px;

  padding-bottom: 3px;
}


.project-tab {
  flex: 0 0 auto;

  min-height: 43px;

  border: 0;
  border-radius: 10px;

  padding: 0 15px;

  background: transparent;
  color: var(--pds-muted);

  font-weight: 700;

  cursor: pointer;
}


.project-tab.active {
  background: var(--pds-navy);
  color: white;
}


.room-grid {
  display: grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap: 14px;

  margin-top: 20px;
}


.room-card {
  padding: 20px;

  border: 1px solid var(--pds-border);
  border-radius: 15px;

  background: var(--pds-cream-light);
}


.room-card h4 {
  margin: 0 0 5px;

  color: var(--pds-navy);
}


.room-card p {
  margin: 0;

  color: var(--pds-muted);

  font-size: 13px;
}


.activity-list {
  display: grid;
  gap: 0;

  margin-top: 15px;
}


.activity-item {
  padding: 15px 0;

  border-bottom:
    1px solid var(--pds-border);
}


.activity-item:last-child {
  border-bottom: 0;
}


.activity-description {
  font-size: 14px;
}


.activity-date {
  margin-top: 4px;

  color: var(--pds-muted);

  font-size: 11px;
}


.info-stack {
  display: grid;
  gap: 18px;
}


.info-label {
  display: block;

  margin-bottom: 5px;

  color: var(--pds-muted);

  font-size: 11px;
  font-weight: 800;

  letter-spacing: .8px;
  text-transform: uppercase;
}


.info-value {
  line-height: 1.5;
}


.project-empty-panel {
  margin-top: 20px;

  padding: 35px;

  border: 1px dashed var(--pds-border);
  border-radius: 16px;

  text-align: center;

  color: var(--pds-muted);
}


.module-placeholder,
.empty-state {
  max-width: 720px;

  margin: 60px auto;

  padding: 55px;

  border-radius: var(--radius-lg);

  text-align: center;

  background: white;

  box-shadow: var(--shadow);
}


.module-placeholder p,
.empty-state p {
  color: var(--pds-muted);

  font-size: 17px;
  line-height: 1.7;
}


.empty-icon {
  margin-bottom: 15px;

  color: var(--pds-terracotta);

  font-size: 38px;
}


.loading-state {
  min-height: 450px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 12px;

  color: var(--pds-muted);
}


.loading-mark {
  color: var(--pds-terracotta);

  font-size: 34px;
}


.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;

  background: rgba(20,32,43,.55);

  backdrop-filter: blur(4px);
}


.modal-card {
  width: min(560px,100%);

  max-height: calc(100vh - 48px);
  overflow-y: auto;

  padding: 28px;

  border-radius: var(--radius-lg);

  background: white;

  box-shadow: var(--shadow-large);
}


.modal-wide {
  width: min(680px,100%);
}


.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  margin-bottom: 25px;
}


.modal-close {
  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 50%;

  background: var(--pds-cream-light);
  color: var(--pds-navy);

  font-size: 24px;

  cursor: pointer;
}


.form-grid {
  display: grid;
  gap: 16px;
}


.form-grid.two-column {
  grid-template-columns:
    repeat(2,minmax(0,1fr));
}


.field {
  display: block;

  margin-bottom: 17px;
}


.field > span {
  display: block;

  margin-bottom: 7px;

  color: var(--pds-navy);

  font-size: 13px;
  font-weight: 700;
}


.field input,
.field select,
.field textarea {
  width: 100%;

  border: 1px solid var(--pds-border);
  border-radius: 12px;

  background: var(--pds-cream-light);
  color: var(--pds-text);

  outline: none;
}


.field input,
.field select {
  min-height: 49px;

  padding: 0 13px;
}


.field textarea {
  padding: 13px;

  resize: vertical;
}


.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--pds-terracotta);

  box-shadow:
    0 0 0 3px rgba(200,106,77,.12);
}


.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;

  margin-top: 25px;
}


.toast-container {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 200;

  display: grid;
  gap: 10px;
}


.toast {
  min-width: 260px;

  padding: 15px 18px;

  border-radius: 12px;

  background: var(--pds-navy);
  color: white;

  box-shadow: var(--shadow-large);

  font-size: 14px;

  animation: toastIn 180ms ease;
}


.toast.error {
  background: var(--pds-danger);
}


@keyframes toastIn {
  from {
    transform: translateY(10px);
    opacity: 0;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}


.empty-projects {
  padding: 45px 20px;

  text-align: center;

  color: var(--pds-muted);
}


@media (max-width: 1100px) {

  .project-grid,
  .client-grid {
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}


@media (max-width: 900px) {

  .app-layout {
    grid-template-columns: 1fr;
  }


  .sidebar {
    position: fixed;

    top: 74px;
    left: 0;
    bottom: 0;

    z-index: 60;

    width: 250px;

    transform: translateX(-100%);

    transition: transform 180ms ease;
  }


  .sidebar.open {
    transform: translateX(0);
  }


  .mobile-menu-button {
    display: block;
  }


  .app-header {
    height: 74px;

    padding: 0 18px;
  }


  .main-content {
    padding: 34px 25px;
  }


  .project-detail-layout {
    grid-template-columns: 1fr;
  }

}

.client-card-actions {
  display: flex;
  gap: 10px;

  margin-top: 20px;
}


.compact-button {
  min-height: 42px;

  padding: 0 14px;

  font-size: 13px;
}


.client-card-actions
.secondary-button {
  flex: 1;
}


.client-card-actions
.primary-button {
  flex: 1;
}

@media (max-width: 680px) {

  .header-action {
    display: none;
  }


  .brand-name {
    font-size: 18px;
  }


  .main-content {
    padding: 27px 16px;
  }


  .summary-grid,
  .project-grid,
  .client-grid,
  .room-grid,
  .form-grid.two-column {
    grid-template-columns: 1fr;
  }

.client-card-actions {
  flex-direction: column;
}


.client-card-actions button {
  width: 100%;
}

  .summary-card {
    min-height: 130px;
  }


  .page-heading-with-action {
    align-items: flex-start;
    flex-direction: column;
  }


  .page-heading-with-action
  .primary-button {
    width: 100%;
  }


  .content-section,
  .detail-panel {
    padding: 21px;
  }


  .section-heading {
    align-items: flex-start;
    flex-direction: column;
  }


  .section-heading
  .primary-button {
    width: 100%;
  }


  .toolbar-split {
    flex-direction: column;
  }


  .filter-select {
    width: 100%;
  }


  .modal-backdrop {
    padding: 10px;
    align-items: flex-end;
  }


  .modal-card {
    width: 100%;

    max-height: 92vh;

    border-radius:
      24px 24px 0 0;
  }


  .modal-actions {
    flex-direction: column-reverse;
  }


  .modal-actions button {
    width: 100%;
  }

}



/* ===============================
   BREADCRUMBS
   =============================== */
.breadcrumbs { display:flex; align-items:center; gap:8px; width:100%; margin-bottom:24px; overflow-x:auto; white-space:nowrap; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.breadcrumbs::-webkit-scrollbar { display:none; }
.breadcrumb-link { flex:0 0 auto; border:0; background:transparent; padding:5px 0; color:var(--pds-terracotta); font-size:13px; font-weight:700; cursor:pointer; }
.breadcrumb-link:hover { text-decoration:underline; }
.breadcrumb-separator { flex:0 0 auto; color:var(--pds-border); font-size:18px; }
.breadcrumb-current { flex:0 0 auto; color:var(--pds-navy); font-size:13px; font-weight:700; }
.breadcrumb-project { max-width:260px; overflow:hidden; text-overflow:ellipsis; }

/* ===============================
   DESIGN HUB
   =============================== */
.design-hub-intro { display:flex; align-items:center; gap:18px; margin-bottom:24px; padding:20px 22px; border-radius:var(--radius-md); background:var(--pds-navy); color:white; }
.design-hub-intro-mark { width:50px; height:50px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(255,255,255,.1); color:var(--pds-terracotta); font-size:24px; }
.design-hub-intro strong { font-size:16px; }
.design-hub-intro p { margin:5px 0 0; color:rgba(255,255,255,.67); font-size:13px; line-height:1.5; }
.design-hub-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
.design-hub-card { overflow:hidden; border:1px solid var(--pds-border); border-radius:var(--radius-md); background:white; box-shadow:0 5px 20px rgba(34,50,63,.05); }
.design-hub-card-image { position:relative; aspect-ratio:16/8; background:linear-gradient(135deg,var(--pds-cream),var(--pds-cream-light)); }
.design-hub-image-placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--pds-terracotta); font-size:34px; }
.design-hub-card-body { padding:21px; }
.design-hub-card-body .project-status { margin-bottom:14px; }
.design-hub-card h3 { margin:0 0 5px; font-size:21px; }
.design-hub-client { color:var(--pds-navy); font-size:14px; font-weight:600; }
.design-hub-address { margin-top:6px; color:var(--pds-muted); font-size:12px; line-height:1.5; }
.design-hub-card-footer { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-top:23px; padding-top:17px; border-top:1px solid var(--pds-border); color:var(--pds-muted); font-size:11px; }
.design-hub-empty { grid-column:1/-1; padding:60px 20px; text-align:center; color:var(--pds-muted); }

/* ===============================
   DESIGN WORKSPACE
   =============================== */
.design-hero { display:grid; grid-template-columns:minmax(0,1fr) minmax(420px,1.35fr); gap:26px; align-items:center; margin-bottom:24px; padding:30px; border-radius:var(--radius-lg); background:var(--pds-navy); color:white; box-shadow:var(--shadow); }
.design-hero h2 { margin:4px 0 8px; color:white; }
